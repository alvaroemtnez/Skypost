[package]
name = "keryx-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
data-encoding = "2.11.1"
keryx = { version = "0.1.0", path = "../keryx" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[[bin]]
name = "keryx"
path = "src/main.rs"
