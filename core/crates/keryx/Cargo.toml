[package]
name = "keryx"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
argon2 = { version = "0.6.0", default-features = false, features = ["alloc", "zeroize"] }
chacha20 = "0.10.2"
data-encoding = "2.11.1"
getrandom = "0.4.3"
hkdf = "0.13.0"
hmac = "0.13.0"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.1"
thiserror = "2.0.21"
x25519-dalek = { version = "3.0.0", features = ["static_secrets", "zeroize"] }
zeroize = { version = "1.9.1", features = ["derive"] }

[dev-dependencies]
serde_json = "1.0.154"
