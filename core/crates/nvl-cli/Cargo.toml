[package]
name = "nvl-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
data-encoding = "2.11.1"
getrandom = "0.4.3"
nvl-proto = { version = "0.1.0", path = "../nvl-proto" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[[bin]]
name = "nvl"
path = "src/main.rs"
