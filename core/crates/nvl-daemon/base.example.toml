# nvl-daemon configuration (base station, member id 0).
# Copy to base.toml and edit. Run: nvl-daemon --config base.toml

[station]
callsign = "EA5XXX"                      # your callsign, sent in clear
state_path = "/var/lib/nvislink/base.json" # from: nvl provision --me 0 ...

[radio]
kind = "loopback"      # "js8" once the JS8 engine is wired in (phase 1)
ofdm_capable = true    # base TX rig is a G90 (linear SSB)
# Dial frequencies (kHz) — TBD, see docs/spec/band-plan.md
# dial_khz_80m = 0.0
# dial_khz_60m = 0.0
# dial_khz_40m = 0.0

[bridges]
log = true

# [bridges.matrix]
# homeserver = "https://matrix.example.org"
# room_id = "!abcdef:example.org"
# access_token_env = "NVL_MATRIX_TOKEN"

