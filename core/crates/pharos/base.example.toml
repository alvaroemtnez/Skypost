# pharos configuration. Copy to base.toml and edit.
# Run: pharos run --config base.toml

[station]
callsign = "EA5XXX"                      # your callsign, sent in clear
state_path = "/var/lib/pharos/base.json" # from: pharos init --alias casa ...

[access]   # docs/spec/pharos.md "Access", decision 0021
# code_file = "/etc/pharos/access-code"               # 0600; four or more random words; admits at once
# admin_password_file = "/etc/pharos/admin-password"  # 0600; lets others become admin
#                          (bridges: "/admin login", radio: encrypted only)
# First run only: afterwards these live in the state file and change with
# admin commands or `pharos set` (stop the service first).
open = false             # anyone may use it; false = closed
requests = true          # while closed, unknown users and contacts may ask to join
login = true             # the admin password works
stealth = false          # no discovery answers, no automatic messages
request_ttl_hours = 72

[bot]
# admins = ["+34600000000"]               # first run only; may send "/admin help"

# Field users on the allow list (first run only). Their URI comes from the
# app's "My QR code".
# [[clients]]
# key = "skypost:id/5P2V...?n=mama"
# admin = true                  # an admin, over the radio
# contacts = ["+34611111111"]   # authorised bridged contacts
# sos = ["+34611111111"]        # get this user's SOS

[radio]
kind = "loopback"      # "js8" once the JS8 engine is wired in (phase 1)
ofdm_capable = true    # base TX rig is a G90 (linear SSB)
# Dial frequencies (kHz) — TBD, see docs/spec/band-plan.md
# dial_khz_80m = 0.0
# dial_khz_60m = 0.0
# dial_khz_40m = 0.0

[bridges]
log = true

# Bridge sidecars, see docs/decisions/0014-bridges-sidecars.md
# [bridges.signal]
# account = "+34600000000"                 # the base's own Signal number
# socket = "/run/signal-cli/socket"        # signal-cli daemon --socket

# [bridges.whatsapp]
# bin = "wacli"

# [bridges.meshcore]
# command = ["python3", "/opt/skypost/sidecars/meshcore/bridge.py"]
# device = "/dev/ttyUSB0"                  # or "host:port" for a TCP companion
