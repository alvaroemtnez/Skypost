# pharos configuration (base station, member id 0).
# Copy to base.toml and edit. Run: pharos --config base.toml

[station]
callsign = "EA5XXX"                      # your callsign, sent in clear
state_path = "/var/lib/pharos/base.json" # from: keryx provision --me 0 ...

[radio]
kind = "loopback"      # "js8" once the JS8 engine is wired in (phase 1)
ofdm_capable = true    # base TX rig is a G90 (linear SSB)
# Dial frequencies (kHz) — TBD, see docs/spec/band-plan.md
# dial_khz_80m = 0.0
# dial_khz_60m = 0.0
# dial_khz_40m = 0.0

[bridges]
log = true

# Bridge sidecars, see docs/decisions/0014-bridges-sidecars.md
# [bridges.signal]
# account = "+34600000000"                 # the base's own Signal number
# socket = "/run/signal-cli/socket"        # signal-cli daemon --socket
# group_id = "BASE64GROUPID=="

# [bridges.whatsapp]
# bin = "wacli"
# to = "Familia"                           # JID, phone number or chat name

# [bridges.meshcore]
# command = ["python3", "/opt/skypost/sidecars/meshcore/bridge.py"]
# device = "/dev/ttyUSB0"                  # or "host:port" for a TCP companion
# channel = "Familia"
