# Phase 0 config. Copy to field.toml / base.toml and edit.

[station]
callsign = "EA5XXX"
# State file from `keryx provision`. Field: --me 1 (or 2..14). Base: --me 0.
state = "~/.local/share/skypost/field.json"
# keryx_bin = "/path/to/keryx"   # default: core/target/{release,debug}/keryx, then $PATH

[js8call]
# Enable the TCP API in JS8Call (Settings > Reporting). VERIFY port on 3.x.
host = "127.0.0.1"
port = 2442

[peer]
base_callsign = "EA5YYY"   # field side: the base station's callsign

[safety]
# Encrypted frames only into a dummy load or in a real emergency.
allow_encrypted_tx = false

[log]
path = "~/skypost-p0.jsonl"   # the propagation dataset; keep these files

# Base side only:
# [bridges.matrix]
# homeserver = "https://matrix.example.org"
# room_id = "!abcdef:example.org"
# access_token_env = "SKYPOST_MATRIX_TOKEN"
#
# [bridges.ntfy]
# url = "https://ntfy.example.org/familia"
